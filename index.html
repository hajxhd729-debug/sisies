<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sisies</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sisies">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F1EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.shopify.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1EA;--paper:#FFFDF9;--paper2:#FBF7F1;--ink:#2A1F17;--ink2:#6E5D4E;--ink3:#A6978A;
  --line:#EADFD2;--line2:#F2EBE2;--bronze:#B08A60;--bronze-d:#8E6B45;--bronze-l:#EFE3D2;
  --esp:#33251B;--good:#4E7A57;--good-l:#E6EFE4;--warn:#B9822B;--warn-l:#F7EBD5;--bad:#B0503D;--bad-l:#F6E3DE;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:22px;--ease:cubic-bezier(.22,1,.36,1);
  --sh:0 1px 2px rgba(51,37,27,.04),0 10px 30px -14px rgba(51,37,27,.22);
  --sh2:0 24px 60px -20px rgba(51,37,27,.5);
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;font-family:var(--sans);font-variant-numeric:lining-nums;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 600px at 110% -10%,#EEE0CE 0%,transparent 60%),radial-gradient(800px 500px at -20% 35%,#F3E9DD 0%,transparent 60%),var(--bg);
  background-attachment:fixed;padding-bottom:calc(120px + var(--sb))}
body.has-bag{padding-bottom:calc(190px + var(--sb))}
body.noscroll{overflow:hidden}
button{font:inherit;font-variant-numeric:lining-nums;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
.muted{color:var(--ink3);font-size:14px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s var(--ease),transform 1s var(--ease)}
#splash.hide{opacity:0;transform:scale(1.08);pointer-events:none}
#splash .sp-logo{width:min(62vw,280px);height:auto;clip-path:inset(0 100% 0 0);opacity:.2;transform:translateY(8px);animation:reveal 1.5s .15s var(--ease) forwards}
#splash .sp-line{width:0;height:1px;background:var(--bronze);margin-top:22px;animation:line 1.2s .9s var(--ease) forwards}
#splash .tag{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink3);margin-top:14px;opacity:0;animation:fadeIn 1s 1.3s forwards}
@keyframes reveal{to{clip-path:inset(0 0 0 0);opacity:1;transform:none}}
@keyframes line{to{width:min(40vw,170px)}}
@keyframes fadeIn{to{opacity:1}}

/* ---------- Lock ---------- */
#lock{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#lock.show{display:flex;animation:fadeIn .5s both}
#lock .lk-logo{width:170px;height:auto}
.lk-t{font-family:var(--serif);font-size:34px;font-weight:500;margin-top:22px}
.lk-s{color:var(--ink3);font-size:14px;margin-top:6px}
.pin-dots{display:flex;gap:18px;margin:28px 0 36px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--bronze);transition:all .2s var(--ease)}
.pin-dots i.f{background:var(--esp);border-color:var(--esp);transform:scale(1.12)}
.pin-dots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.pad button{width:74px;height:74px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-family:var(--serif);font-size:30px;font-weight:500;transition:transform .15s,background .15s;display:grid;place-items:center}
.pad button:active{transform:scale(.9);background:var(--bronze-l)}
.pad button.gh{background:none;border:0}
.lk-cancel{margin-top:26px;font-size:13px;font-weight:700;color:var(--ink3)}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;background:rgba(246,241,234,.8);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid rgba(234,223,210,.7)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.brand-logo{height:22px;width:auto;display:block}
.mono{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--bronze);display:grid;place-items:center;font-family:var(--serif);font-size:24px;font-weight:500;color:var(--esp);background:var(--paper);flex-shrink:0}
.brand-name{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.34em;line-height:1}
.brand-sub{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.top-r{display:flex;align-items:center;gap:8px}
.sync{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--ink2);padding:8px 11px;border-radius:99px;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-l)}
.sync.saving i{background:var(--warn);box-shadow:0 0 0 3px var(--warn-l);animation:pulse 1s infinite}
.sync.off i{background:var(--ink3);box-shadow:0 0 0 3px var(--line2)}
.sync.err i{background:var(--bad);box-shadow:0 0 0 3px var(--bad-l)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);color:var(--ink2);transition:transform .2s var(--ease)}
.icon-btn:active{transform:scale(.9)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- Layout ---------- */
main{max-width:560px;margin:0 auto;padding:10px 20px 0}
.view-in{animation:viewIn .55s var(--ease) both}
#view.quiet *{animation:none!important}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:viewIn .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink3);font-weight:700;display:flex;align-items:center;gap:8px;margin-top:14px}
.title{font-family:var(--serif);font-size:42px;font-weight:500;line-height:1.02;margin:6px 0 0;letter-spacing:-.01em}
.title em{font-style:italic;color:var(--bronze-d)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:30px 2px 12px}
.sec-title{font-family:var(--serif);font-size:25px;font-weight:600}
.link{font-size:12px;font-weight:700;color:var(--bronze-d);letter-spacing:.04em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:24px;color:#F6EEE3;margin-top:18px;box-shadow:var(--sh2);
  background:radial-gradient(120% 140% at 100% 0%,#6B4E37 0%,transparent 55%),linear-gradient(150deg,#3E2D21 0%,#261B14 100%)}
.hero::after{content:'S';position:absolute;right:-14px;bottom:-78px;font-family:var(--serif);font-size:270px;line-height:1;color:rgba(255,255,255,.045);font-weight:500;pointer-events:none}
.hero .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);background-size:250% 100%;animation:shine 5s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes shine{0%{background-position:130% 0}55%,100%{background-position:-30% 0}}
.hero .lbl{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(246,238,227,.6);font-weight:700}
.hero .big{font-family:var(--serif);font-size:60px;font-weight:500;line-height:1;margin:12px 0 2px;letter-spacing:-.01em;display:flex;align-items:baseline;flex-wrap:wrap;gap:8px}
.hero .big small{font-family:var(--sans);font-size:14px;color:rgba(246,238,227,.6);font-weight:700;letter-spacing:.1em}
.hero .meta{display:flex;gap:22px;margin-top:18px;font-size:12px;color:rgba(246,238,227,.65);position:relative}
.hero .meta b{display:block;font-size:22px;color:#fff;font-family:var(--serif);font-weight:600;margin-bottom:1px}
.trend{display:inline-flex;align-items:center;gap:4px;font-family:var(--sans);font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.1);letter-spacing:0}
.trend.up{color:#A9D9AE}.trend.down{color:#F0A99A}
.ring-wrap{position:absolute;right:22px;top:22px;width:84px;height:84px}
.ring{width:84px;height:84px;transform:rotate(-90deg)}
.ring .rb{fill:none;stroke:rgba(255,255,255,.12);stroke-width:6}
.ring .rf{fill:none;stroke:#D9B98E;stroke-width:6;stroke-linecap:round;stroke-dasharray:213.6;stroke-dashoffset:var(--o);animation:ring 1.6s .2s var(--ease) both}
@keyframes ring{from{stroke-dashoffset:213.6}}
.ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1}
.ring-t small{font-family:var(--sans);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(246,238,227,.6);margin-top:3px}

/* ---------- Buttons ---------- */
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:18px;background:var(--esp);color:#F6EEE3;font-weight:700;font-size:15px;letter-spacing:.01em;box-shadow:0 14px 30px -16px rgba(51,37,27,.8);transition:transform .2s var(--ease),opacity .2s}
.cta:active{transform:scale(.98)}
.cta.bronze{background:linear-gradient(135deg,#C49D70,#97703F);color:#fff;box-shadow:0 16px 32px -16px rgba(142,107,69,.9)}
.cta.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.cta.green{background:#2F6E4B;box-shadow:0 14px 30px -16px rgba(47,110,75,.9)}
.cta.danger{background:var(--bad)}
.cta.soft-danger{background:var(--paper);color:var(--bad);border:1px solid var(--bad-l);box-shadow:none}
.cta[disabled]{opacity:.4;pointer-events:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{margin-top:12px}

/* ---------- Bazar mini ---------- */
.bz-mini{display:block;width:100%;text-align:left;margin-top:14px;padding:18px;border-radius:24px;background:linear-gradient(135deg,#FFFDF9,#F6ECDF);border:1px solid #E6D4BD;box-shadow:var(--sh)}
.bz-mini .top-line{display:flex;justify-content:space-between;align-items:center}
.bz-mini .nm{font-family:var(--serif);font-size:26px;font-weight:600;margin-top:6px}
.bz-mini .nums{display:flex;gap:20px;margin:12px 0 12px;font-size:12px;color:var(--ink3)}
.bz-mini .nums b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink);font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--bad)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
.ended{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--bronze),var(--bronze-d));transform-origin:left;animation:grow 1.2s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.lowchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* ---------- Chart ---------- */
.chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart .b{width:100%;max-width:34px;border-radius:10px 10px 6px 6px;background:var(--bronze-l);transform-origin:bottom;animation:growY 1s var(--ease) both;animation-delay:calc(var(--i)*70ms);min-height:4px}
.chart .b.today{background:linear-gradient(180deg,#C49D70,#8E6B45)}
.chart .v{font-size:10px;font-weight:700;color:var(--ink2);min-height:12px}
.chart .d{font-size:11px;color:var(--ink3);font-weight:700}
@keyframes growY{from{transform:scaleY(0)}}

/* ---------- Lists ---------- */
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.thumb{width:46px;height:58px;border-radius:12px;object-fit:cover;background:var(--line2);flex-shrink:0}
.ph{display:grid;place-items:center;font-family:var(--serif);color:var(--bronze);font-size:22px;background:linear-gradient(135deg,#F3E9DC,#E9DBC8)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bronze-l);color:var(--bronze-d);font-weight:800;font-size:13px;flex-shrink:0;letter-spacing:.04em}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--serif);font-size:21px;font-weight:600;white-space:nowrap;text-align:right}
.row .amt small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--ink3);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--line2);color:var(--ink2)}
.pill.bz{background:var(--bronze-l);color:var(--bronze-d)}
.pill.del{background:var(--bad-l);color:var(--bad)}
.pill.low{background:var(--warn-l);color:var(--warn)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 4px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.day-h b{font-family:var(--serif);font-size:17px;letter-spacing:0;text-transform:none;color:var(--ink2)}
.empty{text-align:center;padding:46px 20px;color:var(--ink3);font-size:14px;line-height:1.5}
.empty .serif{font-family:var(--serif);font-size:28px;color:var(--ink);margin-bottom:6px}

/* ---------- Segmented & chips ---------- */
.seg{display:flex;padding:4px;border-radius:16px;background:var(--line2);border:1px solid var(--line);margin-top:18px}
.seg button{flex:1;padding:10px 8px;border-radius:12px;font-size:13px;font-weight:700;color:var(--ink2);transition:all .3s var(--ease)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 10px -4px rgba(51,37,27,.35)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;color:var(--ink2);transition:all .25s var(--ease)}
.chip.on{background:var(--esp);border-color:var(--esp);color:#F6EEE3}
.chip[disabled]{opacity:.4;text-decoration:line-through;pointer-events:none}
.chip .n{font-weight:600;opacity:.6}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.14);flex-shrink:0;display:inline-block}

/* ---------- Product grid ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin-top:20px}
.pcard{text-align:left;display:block;animation:viewIn .65s var(--ease) both;animation-delay:calc(var(--i)*55ms)}
.pimg{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#EFE5D8,#E5D7C5);box-shadow:var(--sh)}
.pimg img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease),opacity .6s;opacity:0}
.pimg img.ld{opacity:1}
.pimg .ph{position:absolute;inset:0;font-size:56px}
.pcard:active .pimg img{transform:scale(1.05)}
.badge{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:99px;background:rgba(255,253,249,.9);backdrop-filter:blur(8px);color:var(--ink)}
.badge.low{color:var(--warn)}
.badge.out{background:rgba(51,37,27,.88);color:#fff}
.sale{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:99px;background:var(--bad);color:#fff}
.pcard.out .pimg img{filter:grayscale(.85) brightness(.92)}
.pinfo{padding:11px 4px 0}
.pname{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.12}
.pprice{font-size:13px;font-weight:700;margin-top:4px;color:var(--ink2)}
.pprice s{color:var(--ink3);font-weight:500;margin-left:6px}
.sw{display:flex;gap:5px;margin-top:8px}
.sw .dot{width:12px;height:12px}

/* ---------- Bag bar & dock ---------- */
.bagbar{position:fixed;left:50%;bottom:calc(94px + var(--sb));transform:translate(-50%,calc(100% + 140px));opacity:0;pointer-events:none;width:calc(100% - 32px);max-width:528px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:20px;background:linear-gradient(135deg,#C49D70,#97703F);color:#fff;box-shadow:0 18px 40px -16px rgba(142,107,69,.9);transition:transform .55s var(--ease),opacity .3s;font-weight:700}
.bagbar.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.bagbar.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:translate(-50%,0) scale(1.05)}}
.bagbar .cnt{display:flex;align-items:center;gap:10px;font-size:14px}
.bagbar .n{min-width:28px;height:28px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:13px;padding:0 6px}
.bagbar .tot{font-family:var(--serif);font-size:22px;font-weight:600;display:flex;align-items:center;gap:6px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sb));z-index:45;width:calc(100% - 32px);max-width:420px;display:flex;gap:4px;padding:7px;border-radius:26px;background:rgba(38,28,21,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px -18px rgba(38,28,21,.85)}
.dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:19px;color:rgba(246,238,227,.55);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;transition:all .4s var(--ease);position:relative}
.dock button.on{color:var(--esp);background:#F6EEE3}
.dock svg.i{width:21px;height:21px}
.dock .bdg{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--bronze);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;letter-spacing:0}

/* ---------- Sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:80}
.sheet-bg{position:absolute;inset:0;background:rgba(30,22,16,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .4s}
.sheet{position:absolute;left:50%;bottom:0;width:100%;max-width:560px;max-height:93vh;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 22px calc(26px + var(--sb));transform:translate(-50%,100%);transition:transform .5s var(--ease);box-shadow:0 -20px 60px -20px rgba(30,22,16,.4)}
.sheet-wrap.open .sheet-bg{opacity:1}
.sheet-wrap.open .sheet{transform:translate(-50%,0)}
.grip{width:44px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 14px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sh-title{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.08}
.sh-title em{font-style:italic;color:var(--bronze-d);font-weight:500}
.x{width:38px;height:38px;border-radius:50%;background:var(--line2);display:grid;place-items:center;color:var(--ink2);flex-shrink:0}
.field{margin-bottom:14px}
.field label,.lbl{display:block;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--paper2);outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.inp:focus{border-color:var(--bronze);box-shadow:0 0 0 4px rgba(176,138,96,.14);background:#fff}
textarea.inp{resize:vertical;min-height:84px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--good);font-weight:700;margin-top:-6px;margin-bottom:12px;min-height:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper2)}
.stepper button{width:42px;height:42px;display:grid;place-items:center;color:var(--ink2);font-size:20px}
.stepper span{min-width:30px;text-align:center;font-weight:800}
.stepper.sm button{width:32px;height:34px;font-size:17px}
.stepper.sm span{min-width:22px;font-size:14px}
.totals .ln{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);padding:5px 0}
.totals .ln.g{color:var(--good)}
.totals .grand{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);margin-top:8px;padding-top:12px}
.totals .grand span{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--ink3)}
.totals .grand b{font-family:var(--serif);font-size:40px;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper2);margin-bottom:14px;font-size:14px;font-weight:600}
.switch{position:relative;width:46px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.3s}
.switch i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:.3s var(--ease)}
.switch input:checked+i{background:var(--esp)}
.switch input:checked+i::after{transform:translateX(18px)}
.divider{height:1px;background:var(--line2);margin:18px 0}

/* product sheet */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -22px;padding:0 22px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img,.gal .ph{flex:0 0 auto;width:auto;height:min(48vh,430px);aspect-ratio:3/4;object-fit:cover;border-radius:22px;scroll-snap-align:center;background:var(--line2);max-width:none}
.gal .ph{font-size:80px}
.ps-price{font-family:var(--serif);font-size:28px;font-weight:600;margin-top:6px;color:var(--ink2)}
.ps-price s{font-size:20px;color:var(--ink3);margin-left:8px;font-weight:500}
.ps-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.ps-left{font-size:13px;font-weight:700;color:var(--ink3);text-align:right;padding-bottom:10px}
.ps-left.low{color:var(--warn)}

/* success & receipt */
.success{text-align:center;padding:8px 0 14px}
.check{width:78px;height:78px;margin:0 auto 14px;border-radius:50%;background:var(--good-l);display:grid;place-items:center;animation:pop .7s var(--ease) both}
.check svg{width:38px;height:38px;stroke:var(--good);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .3s var(--ease) forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.rc-prev{border-radius:18px;overflow:hidden;background:var(--line2);box-shadow:var(--sh);margin:6px auto 18px;max-width:330px;min-height:220px;display:grid;place-items:center}
.rc-prev img{width:100%;display:block}
.spin{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--bronze);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:13px 14px}
.stat .k{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:800}
.stat .v{font-family:var(--serif);font-size:25px;font-weight:600;margin-top:4px;white-space:nowrap}
.pay-row{display:grid;grid-template-columns:100px 1fr auto;align-items:center;gap:12px;padding:8px 0;font-size:13px;font-weight:700}
.pay-row .amt{font-family:var(--serif);font-size:18px}
.inv-n{text-align:right;flex-shrink:0;min-width:58px}
.inv-n b{font-family:var(--serif);font-size:24px;font-weight:600;display:block;line-height:1}
.inv-n span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:800}
.inv-n.low b{color:var(--warn)}
.inv-n.out b{color:var(--bad)}
.stock-row{display:grid;grid-template-columns:40px 1fr 64px 76px 30px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.stock-row .thumb{width:40px;height:50px;border-radius:10px}
.stock-row .inp{padding:9px 8px;font-size:15px;text-align:center}
.stock-row .nm{font-size:13px;font-weight:700;line-height:1.25}
.stock-row .nm small{display:block;color:var(--ink3);font-weight:600}
.stock-row .rm{color:var(--ink3);font-size:20px}
.stock-head{display:grid;grid-template-columns:40px 1fr 64px 76px 30px;gap:8px;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding-bottom:6px}

/* misc */
.q-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:16px;padding:14px 16px;border-radius:20px;background:#E8F1E5;border:1px solid #CFE0CB;color:#24452F;box-shadow:var(--sh)}
.q-card .q-ic{width:42px;height:42px;border-radius:50%;background:#2F6E4B;color:#fff;display:grid;place-items:center;flex-shrink:0;animation:pulseRing 2.2s infinite}
.q-card .mid{flex:1;min-width:0}
.q-card b{display:block;font-size:15px}
.q-card small{font-size:12px;opacity:.75}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(47,110,75,.45)}70%{box-shadow:0 0 0 12px rgba(47,110,75,0)}100%{box-shadow:0 0 0 0 rgba(47,110,75,0)}}
.q-item{border-bottom:1px solid var(--line2);padding:6px 0 14px}
.q-item:last-child{border-bottom:0}
.cta.sm{padding:11px;font-size:13px;border-radius:14px}
.note{background:var(--warn-l);color:#7A5A1E;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note.good{background:var(--good-l);color:#24452F}
.pill.send{background:var(--good-l);color:#2F6E4B}
.dock .bdg.q{background:#2F6E4B}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:300;background:var(--esp);color:#F6EEE3;padding:12px 18px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:var(--sh2);transition:transform .55s var(--ease);display:flex;gap:8px;align-items:center;max-width:90vw}
.toast.show{transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:120}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--paper);margin:18px 0 12px;color:var(--ink3)}
.search input{flex:1;border:0;background:none;outline:none;padding:13px 0}
.foot-note{text-align:center;font-size:11px;color:var(--ink3);margin-top:26px;letter-spacing:.06em}
#printArea{display:none}
@media print{
  body{background:#fff!important;padding:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{width:100%;max-width:90mm;display:block;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media (max-width:370px){.title{font-size:36px}.hero .big{font-size:50px}.stats .v{font-size:21px}}
</style>

   ===================================================================== */
function mergeById(a,b){const m=new Map();[...(b||[]),...(a||[])].forEach(x=>{if(!x||!x.id)return;const p=m.get(x.id);if(!p||(x.updatedAt||'')>=(p.updatedAt||''))m.set(x.id,x)});return [...m.values()].sort((x,y)=>(x.createdAt||'').localeCompare(y.createdAt||''))}

const Store={
  data:{},dirty:new Set(),ver:{},flushing:false,failed:false,remoteOk:false,again:false,timer:null,retry:null,
  init(){
    try{this.dirty=new Set(JSON.parse(localStorage.getItem(LS+'sisies_v2_dirty')||'[]'))}catch(e){}
    [...Object.values(K),...Object.values(L)].forEach(k=>{try{const s=localStorage.getItem(LS+k);if(s!==null)this.data[k]=JSON.parse(s)}catch(e){}});
  },
  get(k,d){const x=this.data[k];return x===undefined||x===null?d:x},
  setLocal(k,x){this.data[k]=x;try{localStorage.setItem(LS+k,JSON.stringify(x))}catch(e){}},
  set(k,x){this.setLocal(k,x);this.ver[k]=(this.ver[k]||0)+1;this.dirty.add(k);this.saveDirty();clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),350);setSync()},
  saveDirty(){try{localStorage.setItem(LS+'sisies_v2_dirty',JSON.stringify([...this.dirty]))}catch(e){}},
  h(extra){return Object.assign({apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},extra||{})},
  async fetchAll(){
    const r=await fetchT(`${SB_URL}/rest/v1/${TABLE}?select=key,value`,{headers:this.h()},8000);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const m={};(await r.json()).forEach(x=>{try{if(x.value!=null)m[x.key]=JSON.parse(x.value)}catch(e){}});return m;
  },
  async fetchOne(k){
    const r=await fetchT(`${SB_URL}/rest/v1/${TABLE}?key=eq.${encodeURIComponent(k)}&select=value`,{headers:this.h()},8000);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const rows=await r.json();return rows.length&&rows[0].value!=null?JSON.parse(rows[0].value):undefined;
  },
  // Update in place; insert only if the key does not exist yet. No delete step, so nothing can be lost mid-save.
  async put(k,x){
    if(SANDBOX)return;
    const value=JSON.stringify(x);
    let r=await fetchT(`${SB_URL}/rest/v1/${TABLE}?key=eq.${encodeURIComponent(k)}&select=key`,{method:'PATCH',headers:this.h({'Content-Type':'application/json',Prefer:'return=representation'}),body:JSON.stringify({value})},12000);
    if(!r.ok)throw new Error('PATCH '+r.status);
    const rows=await r.json();
    if(!rows.length){
      r=await fetchT(`${SB_URL}/rest/v1/${TABLE}`,{method:'POST',headers:this.h({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify({key:k,value})},12000);
      if(!r.ok)throw new Error('POST '+r.status);
    }
  },
  async pull(){
    const remote=await this.fetchAll();this.remoteOk=true;let changed=false;
    for(const [k,x] of Object.entries(remote)){
      const before=JSON.stringify(this.data[k]);
      if(MERGE.has(k))this.setLocal(k,mergeById(this.data[k],x));
      else if(!this.dirty.has(k))this.setLocal(k,x);
      if(JSON.stringify(this.data[k])!==before)changed=true;
    }
    setSync();return changed;
  },
  async flush(){
    if(this.flushing){this.again=true;return}
    if(!this.dirty.size||!navigator.onLine){setSync();return}
    this.flushing=true;setSync();let changed=false;
    try{
      const keys=[...this.dirty].sort((a,b)=>(a===K.ledger?-1:0)-(b===K.ledger?-1:0));
      for(const k of keys){
        const v0=this.ver[k]||0;let x=this.data[k];
        if(MERGE.has(k)){const remote=await this.fetchOne(k);const before=JSON.stringify(this.data[k]);x=mergeById(this.data[k],remote);this.setLocal(k,x);if(JSON.stringify(x)!==before)changed=true}
        await this.put(k,x);
        if(k===K.ledger){const lg=legacyFromLedger(x);for(const [lk,lv] of Object.entries(lg)){await this.put(lk,lv);this.setLocal(lk,lv)}}
        if((this.ver[k]||0)===v0){this.dirty.delete(k);this.saveDirty()}
      }
      this.failed=false;
    }catch(e){console.warn('sync failed',e);this.failed=true;clearTimeout(this.retry);this.retry=setTimeout(()=>this.flush(),15000)}
    finally{this.flushing=false;setSync();if(changed)onRemote();if(this.again){this.again=false;this.flush()}}
  }
};

function setSync(){
  const el=$('#sync');if(!el)return;let c='',t='Synced';const n=Store.dirty.size;
  if(!navigator.onLine){c='off';t=n?'Offline · saved':'Offline'}
  else if(Store.flushing||(n&&!Store.failed)){c='saving';t='Saving'}
  else if(n&&Store.failed){c='err';t='Retrying'}
  if(SANDBOX){c='off';t='Sandbox'}
  el.className='sync '+c;el.querySelector('span').textContent=t;
}

function variantsOf(p){const vs=[...(p.variants||[])];(p.extraColors||[]).forEach(c=>{if(c&&!vs.some(x=>x.color.toLowerCase()===c.toLowerCase()))vs.push({id:'x-'+c,color:c,price:null,image:null,available:true})});return vs.length?vs:[{id:'d',color:'One colour',price:p.price||0}]}
const sameColor=(a,b)=>(a||'').toLowerCase().trim()===(b||'').toLowerCase().trim();
function basePrice(p,color){if(p.priceOverride!==null&&p.priceOverride!==undefined&&p.priceOverride!=='')return +p.priceOverride;const vs=variantsOf(p);const x=vs.find(z=>sameColor(z.color,color))||vs[0];return +(x.price??vs[0].price??0)}

function entryFor(ev,pid,color){if(!ev)return null;const id=String(pid);return ev.stock.find(s=>s.productId===id&&s.color&&sameColor(s.color,color))||ev.stock.find(s=>s.productId===id&&!s.color)||null}

const bagFor=(e,ev)=>S.bag.filter(b=>itemMatches(b,e,ev)).reduce((s,b)=>s+b.qty,0);
function colorLeft(ev,p,color){const e=entryFor(ev,p.id,color);if(!e)return null;return (+e.start||0)-soldFor(ev,e)-bagFor(e,ev)}
function productLeft(ev,p){if(!ev)return null;const es=ev.stock.filter(s=>s.productId===String(p.id));if(!es.length)return null;return es.reduce((s,e)=>s+(+e.start||0)-soldFor(ev,e)-bagFor(e,ev),0)}

  const os=liveOrders().filter(o=>o.eventId===ev.id);
  const rows=ev.stock.map(e=>{const p=productById(e.productId);const sold=soldFor(ev,e,os);return {e,p,sold,left:(+e.start||0)-sold}});
  const total=rows.reduce((s,r)=>s+(+r.e.start||0),0),tracked=rows.reduce((s,r)=>s+r.sold,0);

}

  const dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  const cols=['#B08A60','#D9B98E','#33251B','#EFE3D2','#8E6B45','#F6EEE3'];

  let fr=0;(function tick(){fr++;x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-fr/120);x.fillStyle=p.c;if(p.round){x.beginPath();x.arc(0,0,p.s/2,0,7);x.fill()}else x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(fr<120)requestAnimationFrame(tick);else c.remove()})();
}

  const sale=cmp&&cmp>lo?`<span class="sale">−${Math.round((1-lo/cmp)*100)}%</span>`:'';

function ordersList(){

  if(q)list=list.filter(o=>[o.no,o.customer?.name,o.customer?.phone,o.payment,...(o.items||[]).map(i=>i.title+' '+i.color)].join(' ').toLowerCase().includes(q));

    <div class="inv-n ${r.left<=0?'out':r.left<=3?'low':''}"><b>${Math.max(0,r.left)}</b><span>${r.left<=0?'sold out':'left'}</span></div></div>`}).join(''):`<div class="empty" style="padding:24px">No stock added yet.</div>`}</div>

function openProduct(pid){
  const p=productById(pid);if(!p)return;const ev=activeEvent();const vs=variantsOf(p);
  const avail=x=>{const l=colorLeft(ev,p,x.color);return l===null||l>0};
  let color=(vs.find(avail)||vs[0]).color,qty=1;
  const imgs=[...(p.images||[])];vs.forEach(x=>{if(x.image&&!imgs.includes(x.image))imgs.push(x.image)});
  const sh=openSheet(`
    <div class="gal" id="gal">${imgs.length?imgs.map(u=>`<img src="${esc(img(u,800))}" crossorigin="anonymous" alt="">`).join(''):'<div class="ph">S</div>'}</div>
    <div class="sh-head" style="margin:18px 0 0"><div><div class="eyebrow" style="margin:0">${esc(p.type||'Sisies')}</div><div class="sh-title" style="margin-top:6px">${esc(p.title)}</div><div class="ps-price" id="psPrice"></div></div><button class="x" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="field" style="margin-top:18px"><label>Colour</label><div class="chips wrap" id="psColors"></div></div>
    <div class="ps-row"><div><span class="lbl">Quantity</span><div class="stepper"><button data-q="-1" aria-label="Less">−</button><span id="psQty">1</span><button data-q="1" aria-label="More">+</button></div></div><div class="ps-left" id="psLeft"></div></div>
    <button class="cta bronze" id="psAdd" style="margin-top:22px"></button>`);
  const upd=()=>{
    $('#psColors',sh).innerHTML=vs.map(x=>{const l=colorLeft(ev,p,x.color);const dis=l!==null&&l<=0;return `<button class="chip ${sameColor(x.color,color)?'on':''}" data-c="${esc(x.color)}" ${dis?'disabled':''}><i class="dot" style="background:${swatch(x.color)}"></i>${esc(x.color)}${l!==null?`<span class="n">${Math.max(0,l)}</span>`:''}</button>`}).join('');
    const price=priceFor(p,color,ev),cmp=compareAt(p),l=colorLeft(ev,p,color);
    if(l!==null&&qty>l)qty=Math.max(1,l);
    $('#psPrice',sh).innerHTML=`${LE(price)}${cmp&&cmp>price?`<s>${LE(cmp)}</s>`:''}`;
    $('#psQty',sh).textContent=qty;
    const pl=$('#psLeft',sh);pl.className='ps-left'+(l!==null&&l<=3?' low':'');pl.textContent=l===null?'':l<=0?'Sold out':`${l} left${ev?' at the bazar':''}`;
    const add=$('#psAdd',sh);add.disabled=l!==null&&l<=0;add.innerHTML=`${ic('bag')} Add to bag · ${LE(price*qty)}`;
  };
  upd();
  $('#psColors',sh).addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;color=b.dataset.c;qty=1;upd();
    const x=vs.find(z=>sameColor(z.color,color));const gal=$('#gal',sh);if(x?.image&&gal){const el=gal.children[imgs.indexOf(x.image)];if(el)gal.scrollTo({left:el.offsetLeft-22,behavior:'smooth'})}});
  $$('[data-q]',sh).forEach(b=>b.onclick=()=>{const l=colorLeft(ev,p,color);const nq=qty+(+b.dataset.q);if(nq<1)return;if(l!==null&&nq>l){toast('Only '+l+' left in '+esc(color));return}qty=nq;upd()});
  $('#psAdd',sh).onclick=()=>{
    const price=priceFor(p,color,ev);const x=vs.find(z=>sameColor(z.color,color));
    const ex=S.bag.find(b=>b.productId===String(p.id)&&sameColor(b.color,color)&&b.price===price);
    if(ex)ex.qty+=qty;else S.bag.push({key:uid(),productId:String(p.id),title:p.title,color,qty,price,image:x?.image||p.images?.[0]||null});
    saveBag();closeSheet();renderBagBar(true);if(S.view==='sell')render(true);
    toast(`${ic('bag')} ${esc(p.title)} added to bag`);
  };
}

function calc(co,ev){
  const sub=S.bag.reduce((s,b)=>s+b.qty*b.price,0);let type='le',val=0;
  if(co.disc==='event'&&ev){type='pct';val=+ev.discountPct||0}else if(co.disc==='custom'){type=co.dt;val=+co.dv||0}
  const d=type==='pct'?sub*Math.min(Math.max(val,0),100)/100:Math.min(Math.max(val,0),sub);
  return {sub,type,val,disc:Math.round(d),total:Math.max(0,Math.round(sub-d))};
}

function receiptText(o){
  const s=settings(),L2=[];
  L2.push('*SISIES*','_Receipt · No. '+o.no+'_','');
  L2.push('Date: '+gbDate(o.createdAt)+' · '+fmtTime(o.createdAt));if(o.customer?.name)L2.push('Customer: '+o.customer.name);L2.push('');
  (o.items||[]).forEach(i=>L2.push(`• ${i.title}${i.color?' ('+i.color+')':''} ×${i.qty} — ${LE(i.qty*i.price)}`));
  L2.push('','Subtotal: '+LE(o.subtotal));
  if(o.discount>0)L2.push(`Discount${o.discountType==='pct'?' ('+o.discountValue+'%)':''}: −${LE(o.discount)}`);

function loadImg(u){return new Promise(r=>{if(!u)return r(null);const im=new Image();im.crossOrigin='anonymous';const t=setTimeout(()=>r(null),3500);im.onload=()=>{clearTimeout(t);r(im)};im.onerror=()=>{clearTimeout(t);r(null)};im.src=u})}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function txt(x,s,a,b,{font,color='#2A1F17',align='left',ls=0}){x.font=font;x.fillStyle=color;x.textAlign=align;const has='letterSpacing' in x;if(has)x.letterSpacing=ls+'px';x.fillText(s,a+(has&&align==='center'?ls/2:0),b);if(has)x.letterSpacing='0px'}
function wrapLines(x,s,max){const out=[];(s||'').split('\n').forEach(par=>{let line='';par.split(' ').forEach(w=>{const t=line?line+' '+w:w;if(x.measureText(t).width>max&&line){out.push(line);line=w}else line=t});if(line)out.push(line)});return out}
function ellipsize(x,s,max){if(x.measureText(s).width<=max)return s;while(s.length&&x.measureText(s+'…').width>max)s=s.slice(0,-1);return s+'…'}
function cover(x,im,dx,dy,dw,dh){const r=Math.max(dw/im.width,dh/im.height),sw=dw/r,sh=dh/r;x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,dx,dy,dw,dh)}
function dash(x,a,b,y){x.save();x.setLineDash([2,11]);x.lineCap='round';x.strokeStyle='#D7C6B0';x.lineWidth=3;x.beginPath();x.moveTo(a,y);x.lineTo(b,y);x.stroke();x.restore()}
async function drawReceipt(o){
  const SER='"Cormorant Garamond", Georgia, serif',SAN='Manrope, "Segoe UI", Arial, sans-serif';
  try{await Promise.all([`500 80px ${SER}`,`600 60px ${SER}`,`italic 500 50px ${SER}`,`700 30px ${SAN}`,`500 24px ${SAN}`].map(fn=>document.fonts.load(fn)))}catch(e){}
  const W=1080,M=40,P=112,cx=W/2,s=settings();
  const [logo,...thumbs]=await Promise.all([loadImg('logo.png'),...(o.items||[]).map(i=>loadImg(i.image?img(i.image,240):null))]);
  const c=document.createElement('canvas');c.width=W;c.height=2400+(o.items||[]).length*180;const x=c.getContext('2d');
  let y=130;
  if(logo){const lw=560,lh=logo.height*lw/logo.width;x.drawImage(logo,cx-lw/2,y,lw,lh);y+=lh+34}
  else{y+=90;txt(x,'SISIES',cx,y,{font:`600 64px ${SER}`,color:'#5C432F',align:'center',ls:24});y+=10}
  x.fillStyle='#B08A60';x.fillRect(cx-90,y,180,2);y+=12;
  y+=54;txt(x,'RECEIPT  ·  No. '+o.no,cx,y,{font:`700 22px ${SAN}`,color:'#A6978A',align:'center',ls:6});
  y+=42;txt(x,fmtLong(o.createdAt),cx,y,{font:`500 24px ${SAN}`,color:'#A6978A',align:'center'});
  if(o.customer?.name){y+=88;txt(x,'Thank you, '+o.customer.name.trim().split(/\s+/)[0],cx,y,{font:`italic 500 56px ${SER}`,color:'#33251B',align:'center'})}
  y+=66;dash(x,P,W-P,y);y+=58;
  (o.items||[]).forEach((it,i)=>{
    const im=thumbs[i];let tx=P;
    if(im){x.save();rr(x,P,y,100,126,18);x.clip();cover(x,im,P,y,100,126);x.restore();tx=P+132}
    const ps=LE(it.qty*it.price);x.font=`700 31px ${SAN}`;const pw=x.measureText(ps).width;const ty=im?y+50:y+32;
    txt(x,ellipsize(x,it.title,W-P-tx-pw-30),tx,ty,{font:`700 31px ${SAN}`});
    txt(x,[it.color,'× '+it.qty,it.qty>1?LE(it.price)+' each':''].filter(Boolean).join('   ·   '),tx,ty+44,{font:`500 24px ${SAN}`,color:'#A6978A'});
    txt(x,ps,W-P,ty,{font:`700 31px ${SAN}`,align:'right'});
    y+=im?162:108;
  });
  y+=6;dash(x,P,W-P,y);y+=66;
  const line=(a,b,col='#6E5D4E')=>{txt(x,a,P,y,{font:`500 27px ${SAN}`,color:col});txt(x,b,W-P,y,{font:`600 27px ${SAN}`,color:col,align:'right'});y+=50};
  line('Subtotal',LE(o.subtotal));
  if(o.discount>0)line('Discount'+(o.discountType==='pct'?` (${o.discountValue}%)`:''),'− '+LE(o.discount),'#4E7A57');
  y+=34;txt(x,'TOTAL',P,y,{font:`800 23px ${SAN}`,color:'#A6978A',ls:6});txt(x,fmt(o.total)+' LE',W-P,y+8,{font:`700 64px ${SAN}`,color:'#33251B',align:'right',ls:-1});y+=62;
  if(o.payment){txt(x,'Paid by '+o.payment,W-P,y,{font:`600 24px ${SAN}`,color:'#B08A60',align:'right'});y+=24}
  y+=46;dash(x,P,W-P,y);y+=70;
  if(s.policy){x.font=`italic 500 31px ${SER}`;wrapLines(x,s.policy,W-2*P-40).forEach(l=>{txt(x,l,cx,y,{font:`italic 500 31px ${SER}`,color:'#6E5D4E',align:'center'});y+=42});y+=24}
  if(s.thanks){txt(x,s.thanks,cx,y,{font:`700 27px ${SAN}`,color:'#33251B',align:'center'});y+=58}
  txt(x,'SISIESEG.COM   ·   @SISIES.EG',cx,y,{font:`800 19px ${SAN}`,color:'#B08A60',align:'center',ls:5});y+=78;
  const H=y+M,out=document.createElement('canvas');out.width=W;out.height=H;const z=out.getContext('2d');
  z.fillStyle='#EDE2D3';z.fillRect(0,0,W,H);
  z.save();z.shadowColor='rgba(51,37,27,.14)';z.shadowBlur=40;z.shadowOffsetY=12;rr(z,M,M,W-2*M,H-2*M,44);z.fillStyle='#FFFDF9';z.fill();z.restore();
  rr(z,M+18,M+18,W-2*M-36,H-2*M-36,30);z.strokeStyle='rgba(176,138,96,.35)';z.lineWidth=2;z.stroke();
  z.drawImage(c,0,0,W,H,0,0,W,H);
  return out;
}

  $('#beAdd',sh).onclick=()=>{const pid=$('#beP',sh).value,color=$('#beC',sh).value||null,q=parseInt($('#beQ',sh).value,10)||0;if(!pid)return;
    const dup=ev.stock.find(s=>s.productId===pid&&sameColor(s.color||'',color||''));if(dup){dup.start+=q}else ev.stock.push({id:uid(),productId:pid,color,start:q,price:null});$('#beQ',sh).value='';stock()};
  $('#beSave',sh).onclick=()=>{ev.name=$('#beName',sh).value.trim()||'Bazar';ev.date=$('#beDate',sh).value||isoDay(new Date());ev.discountPct=Math.min(100,Math.max(0,+$('#beDisc',sh).value||0));
    setEvent(ev);closeSheet();render(true);toast('Bazar saved')};
}
function newBazar(){
  const now=new Date().toISOString();const ev={id:uid(),name:'New Bazar',date:isoDay(new Date()),discountPct:0,closed:false,createdAt:now,updatedAt:now,stock:[]};
  setEvent(ev);Store.set(K.settings,{...settings(),activeEventId:ev.id});S.bz=ev.id;S.view='bazar';render();openBazarEdit(ev.id);
}
async function endBazar(id){
  const ev=events().find(e=>e.id===id);if(!ev)return;
  if(!await confirmSheet({title:'End this bazar?',msg:`New sales will no longer count toward <b>${esc(ev.name)}</b>. Its report stays available and you can make it live again any time.`,ok:'End bazar'}))return;
  setEvent({...ev,closed:true});if(settings().activeEventId===id)Store.set(K.settings,{...settings(),activeEventId:null});S.sellMode='all';render(true);toast('Bazar ended');
}
function reopenBazar(id){const ev=events().find(e=>e.id===id);if(!ev)return;setEvent({...ev,closed:false});Store.set(K.settings,{...settings(),activeEventId:id});S.sellMode='bazar';render(true);toast(`${esc(ev.name)} is live`)}
function exportBazar(id){
  const ev=events().find(e=>e.id===id);if(!ev)return;const st=eventStats(ev);const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const R=[[ev.name+' — report'],['Date',ev.date],['Revenue (LE)',st.revenue],['Orders',st.os.length],['Pieces sold',st.pieces],[],['Payment','Amount (LE)'],...Object.entries(st.pays),[],
    ['Product','Colour','Starting stock','Sold','Left','Price (LE)'],...st.rows.map(r=>[r.p?.title||'',r.e.color||'All colours',r.e.start,r.sold,Math.max(0,r.left),r.p?priceFor(r.p,r.e.color,ev):r.e.price]),[],
    ['Order No.','Date','Time','Customer','Phone','Items','Payment','Discount (LE)','Total (LE)'],
    ...st.os.map(o=>[o.no,gbDate(o.createdAt),fmtTime(o.createdAt),o.customer?.name,o.customer?.phone,(o.items||[]).map(i=>`${i.title}${i.color?' ('+i.color+')':''} x${i.qty}`).join('; '),o.payment,o.discount,o.total])];
  download(`sisies-${(ev.name||'bazar').toLowerCase().replace(/[^a-z0-9]+/g,'-')}-report.csv`,'﻿'+R.map(r=>r.map(q).join(',')).join('\n'));
}

/* =====================================================================
   Settings & catalog
   ===================================================================== */
async function syncCatalog(silent){
  try{
    const r=await fetchT(SHOP+'/products.json?limit=250',{},12000);if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();const cur=catalog();const old=new Map(cur.products.map(p=>[String(p.id),p]));
    const web=(d.products||[]).map(p=>{const o=old.get(String(p.id))||{};return {id:String(p.id),title:p.title,handle:p.handle,type:p.product_type||'',
      images:(p.images||[]).slice(0,6).map(i=>i.src.split('?')[0]),
      variants:(p.variants||[]).map(x=>({id:String(x.id),color:x.option1||'One colour',price:+x.price,compareAt:x.compare_at_price?+x.compare_at_price:null,available:x.available,image:x.featured_image?x.featured_image.src.split('?')[0]:null})),
      source:'web',hidden:!!o.hidden,priceOverride:o.priceOverride??null,extraColors:o.extraColors||[]}});
    const gone=cur.products.filter(p=>p.source==='web'&&!web.some(w=>w.id===String(p.id))).map(p=>({...p,removed:true}));
    Store.set(K.catalog,{syncedAt:new Date().toISOString(),products:[...web,...gone,...cur.products.filter(p=>p.source==='manual')]});
    if(!silent)toast(`✦ ${web.length} products synced from sisieseg.com`);
    if(!sheetEl)render(true);
    return true;
  }catch(e){console.warn('catalog sync',e);if(!silent)toast('Could not reach sisieseg.com');return false}
}
function openSettings(){
  const s=settings(),cat=catalog();const ps=cat.products.filter(p=>!p.removed);
  const sh=openSheet(`
    <div class="sh-head"><div class="sh-title">Settings</div><button class="x" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="sec-head" style="margin-top:6px"><div class="sec-title">Products</div><span class="muted" style="font-size:12px">Synced ${ago(cat.syncedAt)}</span></div>
    <button class="cta ghost" id="stSync">${ic('sync')} Sync from sisieseg.com</button>
    <div class="card" style="margin-top:12px;padding:4px 16px">${ps.map(p=>`<button class="row" data-pe="${esc(p.id)}">${thumbHTML(p.images?.[0])}<div class="mid"><div class="t">${esc(p.title)}</div><div class="s">${variantsOf(p).map(x=>esc(x.color)).join(' · ')}</div></div><div class="amt" style="font-size:18px">${fmt(basePrice(p))}<small>${p.hidden?'hidden':p.priceOverride!=null&&p.priceOverride!==''?'custom price':p.source==='manual'?'manual':'LE'}</small></div></button>`).join('')}</div>
    <button class="cta ghost mt" id="stAdd">${ic('plus')} Add a product</button>
    <div class="sec-head"><div class="sec-title">Receipt</div></div>
    <div class="field"><label>Store policy</label><textarea class="inp" id="stPol">${esc(s.policy||'')}</textarea></div>
    <div class="field"><label>Thank-you line</label><input class="inp" id="stThx" value="${esc(s.thanks||'')}"></div>
    <div class="sec-head"><div class="sec-title">WhatsApp receipts</div></div>
    <label class="toggle"><span>This phone has the <b>Sisies WhatsApp</b><br><small class="muted" style="font-size:12px">It sends the queued receipts. Other phones only add to the queue.</small></span><span class="switch"><input type="checkbox" id="stWa" ${isWaDevice()?'checked':''}><i></i></span></label>
    <div class="sec-head"><div class="sec-title">Security</div></div>
    <div class="btn-row"><button class="cta ghost" id="stPin">${ic('lock')} ${s.pinHash?'Change PIN':'Set PIN'}</button><button class="cta ghost" id="stLock">${ic('lock')} Lock now</button></div>
    <div class="foot-note">Sisies Boutique Studio v2 · saved on this phone and in the cloud</div>`,
    {onClose:()=>{const pol=$('#stPol',sh)?.value,thx=$('#stThx',sh)?.value;const cur=settings();if(pol!==undefined&&(pol!==cur.policy||thx!==cur.thanks))Store.set(K.settings,{...cur,policy:pol,thanks:thx})}});
  $('#stSync',sh).onclick=async e=>{const b=e.currentTarget;b.disabled=true;b.innerHTML=`<span class="spin" style="width:18px;height:18px"></span> Syncing…`;await syncCatalog(false);openSettings()};
  sh.addEventListener('click',e=>{const b=e.target.closest('[data-pe]');if(b)openProductEdit(b.dataset.pe)});
  $('#stAdd',sh).onclick=()=>openProductEdit(null);
  $('#stWa',sh).onchange=e=>{setWaDevice(e.target.checked);toast(e.target.checked?'✦ This phone now sends receipts':'This phone will only queue receipts');render(true)};
  $('#stPin',sh).onclick=()=>{closeSheet(true);Lock.show('create',true)};
  $('#stLock',sh).onclick=()=>{closeSheet(true);sessionStorage.removeItem('sisies_unlocked');Lock.show(settings().pinHash?'enter':'create')};
}
function openProductEdit(pid){
  const p=pid?productById(pid):null;const manual=!p||p.source==='manual';
  const base=p?(p.variants?.[0]?.price??0):'';
  const extra=p?(manual?variantsOf(p).map(x=>x.color):(p.extraColors||[])).join(', '):'';
  const sh=openSheet(`
    <div class="sh-head"><div class="sh-title">${p?esc(p.title):'New <em>product</em>'}</div><button class="x" data-close aria-label="Close">${ic('x')}</button></div>
    ${manual?`<div class="field"><label>Name</label><input class="inp" id="peT" value="${esc(p?.title||'')}" placeholder="e.g. Linen Set"></div>`:`<p class="muted" style="margin:-4px 0 16px">From sisieseg.com · website price ${LE(base)}</p>`}
    <div class="field"><label>${manual?'Price (LE)':'Price in the app (leave empty to use website price)'}</label><input class="inp" id="peP" type="number" inputmode="decimal" min="0" value="${manual?esc(base):esc(p.priceOverride??'')}" placeholder="${manual?'0':fmt(base)}"></div>
    <div class="field"><label>${manual?'Colours (comma separated)':'Extra colours (comma separated)'}</label><input class="inp" id="peC" value="${esc(extra)}" placeholder="e.g. Burgundy, Black"></div>
    ${p?`<label class="toggle"><span>Hide from the sell screen</span><span class="switch"><input type="checkbox" id="peH" ${p.hidden?'checked':''}><i></i></span></label>`:''}
    <button class="cta bronze" id="peS">Save</button>
    <button class="cta ghost mt" id="peBack">Back to settings</button>`);
  $('#peBack',sh).onclick=()=>openSettings();
  $('#peS',sh).onclick=()=>{
    const cat=catalog();const price=$('#peP',sh).value;const cols=$('#peC',sh).value.split(',').map(x=>x.trim()).filter(Boolean);
    let list=cat.products;
    if(manual){const t=$('#peT',sh).value.trim();if(!t){toast('Give the product a name');return}
      const np={id:p?.id||'m-'+uid(),title:t,handle:'',type:'',images:p?.images||[],source:'manual',hidden:!!$('#peH',sh)?.checked,priceOverride:null,extraColors:[],
        variants:(cols.length?cols:['One colour']).map(c=>({id:'m-'+uid(),color:c,price:+price||0,compareAt:null,available:true,image:null}))};
      list=p?list.map(x=>x.id===p.id?np:x):[...list,np];}
    else list=list.map(x=>x.id===p.id?{...x,priceOverride:price===''?null:+price,extraColors:cols,hidden:!!$('#peH',sh)?.checked}:x);
    Store.set(K.catalog,{...cat,products:list});toast('Product saved');openSettings();if(S.view==='sell')render(true);
  };
}

/* =====================================================================
   PIN lock (convenience lock for the shop phone)
   ===================================================================== */
async function hashPin(pin){const s='sisies|'+pin;if(window.crypto?.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return 'w'+h}
const Lock={mode:'enter',buf:'',first:'',busy:false,
  init(){$('#lkPad').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')+`<button class="gh" disabled></button><button data-k="0">0</button><button class="gh" data-k="del" aria-label="Delete">⌫</button>`;
    $('#lkPad').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)this.press(b.dataset.k)});
    document.addEventListener('keydown',e=>{if(!$('#lock').classList.contains('show'))return;if(/^\d$/.test(e.key))this.press(e.key);else if(e.key==='Backspace')this.press('del')});
    $('#lkCancel').onclick=()=>this.hide();},
  show(mode,cancelable){this.mode=mode;this.buf='';$('#lkCancel').hidden=!cancelable;this.labels();this.dots();$('#lock').classList.add('show')},
  hide(){$('#lock').classList.remove('show')},
  labels(){const m={enter:['Welcome back','Enter your PIN'],create:['Create a PIN','Choose 4 digits to protect the shop'],confirm:['Confirm PIN','Enter the same 4 digits again']}[this.mode];$('#lkT').textContent=m[0];$('#lkS').textContent=m[1]},
  dots(){$$('#lkD i').forEach((d,i)=>d.classList.toggle('f',i<this.buf.length))},
  fail(msg){const d=$('#lkD');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');if(navigator.vibrate)navigator.vibrate(120);if(msg)$('#lkS').textContent=msg},
  async press(k){if(this.busy)return;if(k==='del')this.buf=this.buf.slice(0,-1);else if(this.buf.length<4)this.buf+=k;this.dots();
    if(this.buf.length===4){this.busy=true;await sleep(140);await this.done();this.busy=false}},
  async done(){const pin=this.buf;this.buf='';
    if(this.mode==='enter'){if(await hashPin(pin)===settings().pinHash)this.unlock();else{this.dots();this.fail('Wrong PIN — try again')}}
    else if(this.mode==='create'){this.first=pin;this.mode='confirm';this.labels();this.dots()}
    else{if(pin===this.first){Store.set(K.settings,{...settings(),pinHash:await hashPin(pin)});toast('✦ PIN saved');this.unlock()}else{this.mode='create';this.labels();this.dots();this.fail('PINs didn’t match — start again')}}},
  unlock(){sessionStorage.setItem('sisies_unlocked','1');this.hide()}
};
function checkLock(){if(sessionStorage.getItem('sisies_unlocked')==='1')return;Lock.show(settings().pinHash?'enter':'create')}

/* =====================================================================
   Actions & boot
   ===================================================================== */
const ACT={
  nav:d=>{S.view=d.view;window.scrollTo({top:0});render()},
  product:d=>openProduct(d.pid),
  mode:d=>{S.sellMode=d.mode;render()},
  checkout:()=>openCheckout(),
  queue:()=>openQueue(),
  order:d=>openOrder(d.id),
  ofilter:d=>{S.of=d.f;$$('[data-act="ofilter"]').forEach(b=>b.classList.toggle('on',b.dataset.f===d.f));$('#olist').innerHTML=ordersList()},
  settings:()=>openSettings(),
  'go-bazar':()=>{S.view='bazar';window.scrollTo({top:0});render()},
  'bz-sel':d=>{S.bz=d.id;render()},
  'bz-edit':d=>openBazarEdit(d.id),
  'bz-new':()=>newBazar(),
  'bz-export':d=>exportBazar(d.id),
  'bz-end':d=>endBazar(d.id),
  'bz-reopen':d=>reopenBazar(d.id)
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const fn=ACT[a.dataset.act];if(fn){e.preventDefault();fn(a.dataset,a,e)}});
window.addEventListener('online',()=>{setSync();Store.flush()});
window.addEventListener('offline',setSync);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&navigator.onLine)Store.pull().then(ch=>{if(ch)onRemote()}).catch(()=>{})});

async function boot(){
  const t0=Date.now();
  renderDock();Lock.init();Store.init();
  try{await Store.pull()}catch(e){console.warn('Cloud unreachable, using saved data',e)}
  migrate();seed();
  if(!activeEvent())S.sellMode='all';
  render();Store.flush();
  await sleep(Math.max(0,2000-(Date.now()-t0)));
  $('#splash').classList.add('hide');setTimeout(()=>$('#splash')?.remove(),1000);
  checkLock();
  const cat=catalog();if(navigator.onLine&&(!cat.syncedAt||Date.now()-Date.parse(cat.syncedAt)>6*36e5))syncCatalog(true);
  S.lastPending=pendingReceipts().length;
  // The Sisies WhatsApp phone checks for new receipts more often.
  const tick=()=>{if(navigator.onLine&&!Store.flushing&&document.visibilityState==='visible')Store.pull().then(ch=>{if(ch)onRemote()}).catch(()=>{});setTimeout(tick,isWaDevice()?15000:45000)};
  setTimeout(tick,isWaDevice()?15000:45000);
}
boot();

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(e=>console.warn('SW register failed',e))})}
</script>
